spring.application.name=cinema_service
spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]

# ============================================================
# Server
# ============================================================
server.servlet.context-path=/cinemas



# ===============================
# = KAFKA
# ===============================
spring.kafka.bootstrap-servers=18.188.55.33:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=5000

# Consumer
spring.kafka.consumer.group-id=cinema-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ===============================
# = TICKETS SERVICE
# ===============================
services.tickets.url=http://localhost:8085

# ===============================
# = USERS SERVICE
# ===============================
services.users.url=http://localhost:8082
