version: '3.8'

services:
  cinema-service:
    image: microservice-cinema:latest
    container_name: cinema-service
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=America/Guatemala
    expose:
      - '8084' # Solo visible internamente para Nginx
    networks:
      - microservices-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8084/cinemas/actuator/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: cinema-nginx
    restart: unless-stopped
    ports:
      - '80:80' # El único puerto abierto al EC2
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      cinema-service:
        condition: service_healthy
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
